# Copy to ~/.config/agent-exchange/config.toml (or point AGENT_EXCHANGE_CONFIG at it).
# Every field is optional; built-in defaults cover anthropic, openai and xai.
default_provider = "anthropic"   # AGENT_EXCHANGE_PROVIDER overrides this

[providers.anthropic]
api_key_env = "ANTHROPIC_API_KEY"   # read the key from this env var...
# api_key = "sk-ant-..."            # ...or set it inline (keep the file private!)
model = "claude-opus-5-5"

[providers.openai]
api_key_env = "OPENAI_API_KEY"
model = "gpt-5"

[providers.xai]
api_key_env = "XAI_API_KEY"
base_url = "https://api.x.ai/v1"
model = "grok-4"

# Any other OpenAI-compatible endpoint:
# [providers.local]
# kind = "openai"
# base_url = "http://localhost:11434/v1"
# api_key = "unused"
# model = "llama3"
