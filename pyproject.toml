[project]
name = "agent-exchange-mcp"
version = "0.1.0"
description = "MCP server that lets an AI client call Claude via the Anthropic API"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "anthropic>=0.40"]

[project.scripts]
agent-exchange-mcp = "agent_exchange_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_exchange_mcp"]
